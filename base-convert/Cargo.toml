[workspace]
resolver = "2"
members = [
    "crates/base-format",
    "crates/base-quant",
    "crates/base-awq",
    "crates/base-readers",
    "crates/base-arch",
    "crates/base-sign",
    "crates/base-hub",
    "crates/base-convert",
]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/basecompute/baseRT"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
base-format = { path = "crates/base-format" }
base-quant = { path = "crates/base-quant" }
base-awq = { path = "crates/base-awq" }
base-readers = { path = "crates/base-readers" }
base-arch = { path = "crates/base-arch" }
base-sign = { path = "crates/base-sign" }
base-hub = { path = "crates/base-hub" }

# External
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
memmap2 = "0.9"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
half = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
bitflags = { version = "2", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
indicatif = "0.17"
rayon = "1"
tempfile = "3"
# 1.0 is required for Xet: `hf-xet` is a hard dependency there, so Xet-backed
# repos (the default for new uploads on the Hub) transfer over the dedup CAS
# path instead of falling back to plain HTTPS. 1.0 dropped the `ureq` feature —
# it is reqwest/tokio underneath — so the sync surface is now the `blocking`
# feature, which parks one current-thread runtime on a background thread.
# `rustls-tls` keeps the build off OpenSSL, as the ureq stack did.
hf-hub = { version = "1.0", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
dirs = "5"
